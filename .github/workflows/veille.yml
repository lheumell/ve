name: Veille VE

on:
  schedule:
    - cron: "7,37 * * * *"      # 2x/heure (heure UTC, décalé pour éviter les pics)
  workflow_dispatch:             # bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: true

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests beautifulsoup4

      - name: Collecte des lots
        run: python build_site.py --sites vpauto

      - name: Publication si changement
        run: |
          if [ -n "$(git status --porcelain docs/lots.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/lots.json
            git commit -m "lots $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          else
            echo "aucun changement"
          fi
