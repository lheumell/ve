<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veille VE</title>
<style>
:root{--bg:#f3f6f7;--card:#fff;--txt:#16323f;--mut:#5a6b75;--line:#e3e9eb;--acc:#1d7a55;--warn:#b45309;--up:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#10181c;--card:#18232a;--txt:#e6eef1;--mut:#93a4ad;--line:#26343c;--acc:#3fbf8a;--warn:#f0a95b;--up:#f08a8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,sans-serif}
.wrap{max-width:980px;margin:auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0}
.meta,.bar{color:var(--mut);font-size:13px}
.bar{margin:10px 0}
.panel{background:var(--card);border-radius:12px;padding:12px;margin-top:12px;box-shadow:0 1px 3px #0002}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
input,select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--txt);min-width:0;width:100%}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px}
.opts label{flex-direction:row;align-items:center;gap:6px;color:var(--txt);font-size:13px}
.opts input{width:auto}
button.reset{margin-left:auto;font:inherit;font-size:13px;border:1px solid var(--line);background:none;color:var(--txt);border-radius:8px;padding:4px 10px;cursor:pointer}
.card{display:flex;gap:12px;background:var(--card);border-radius:12px;padding:10px;margin:10px 0;
  text-decoration:none;color:inherit;box-shadow:0 1px 3px #0002}
.thumb{width:150px;height:110px;object-fit:cover;border-radius:8px;flex-shrink:0;background:var(--line);
  display:flex;align-items:center;justify-content:center;font-size:32px}
.body{min-width:0;flex:1}
.name{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.cout{margin-top:6px;font-size:16px}
.cout b{font-size:18px}
.cout small,.facts small{color:var(--mut)}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-top:4px}
.tag{display:inline-block;font-size:11px;border-radius:5px;padding:1px 6px;margin:6px 6px 0 0;background:var(--line);color:var(--mut)}
.tag.new{background:var(--acc);color:#fff;font-weight:700}
.tag.down{background:var(--acc);color:#fff}
.tag.up{background:var(--up);color:#fff}
.tag.warn{color:var(--warn)}
#refresh{font:inherit;font-size:13px;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:5px 12px;cursor:pointer}
#refresh:disabled{opacity:.6;cursor:progress}
#etat{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--card);font-size:13px;box-shadow:0 1px 3px #0002}
#etat.err{color:var(--up)}
.card{position:relative}
.fav{position:absolute;top:6px;right:6px;font-size:22px;line-height:1;border:0;background:var(--card);color:var(--mut);border-radius:50%;width:36px;height:36px;cursor:pointer;box-shadow:0 1px 3px #0003}
.fav.on{color:#e0a100}
.tag.fav-tag{background:#e0a100;color:#fff}
.tag.score{background:var(--line);color:var(--txt);font-weight:700}
.tag.hot{background:var(--warn);color:#fff;font-weight:700}
.card.retire{opacity:.65}
.outils{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.outils button,.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:none;color:var(--txt);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip.on{background:#e0a100;border-color:#e0a100;color:#fff}
.empty{padding:26px 10px;text-align:center;color:var(--mut)}
@media(max-width:560px){.thumb{width:96px;height:84px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>⚡ Veille VE — enchères</h1>
  <span class="meta"><span id="maj">chargement…</span> <button id="refresh" type="button" hidden>↻ Nouvelle recherche</button></span>
</header>
<div id="etat" hidden></div>

<div class="panel">
  <div class="grid">
    <label>Recherche<input id="q" type="search" placeholder="Zoé, Tesla, Lorient…"></label>
    <label>Site<select id="site"><option value="">Tous</option></select></label>
    <label>Coût frais compris min €<input id="cmin" type="number" inputmode="numeric" step="500"></label>
    <label>Coût frais compris max €<input id="cmax" type="number" inputmode="numeric" step="500"></label>
    <label>Km max<input id="kmax" type="number" inputmode="numeric" step="5000"></label>
    <label>Année min<input id="amin" type="number" inputmode="numeric" step="1"></label>
    <label>SoH min %<input id="sohmin" type="number" inputmode="numeric" step="1"></label>
    <label>Batterie min kWh<input id="kwhmin" type="number" inputmode="numeric" step="5"></label>
    <label>Départements<input id="dept" type="text" placeholder="59, 62, 80"></label>
    <label>Vente à partir du<input id="vdu" type="date"></label>
    <label>Vente jusqu’au<input id="vau" type="date"></label>
    <label>Trier par<select id="tri">
      <option value="nouveaute">Nouveautés</option>
      <option value="score">Score</option>
      <option value="cout_estime">Coût frais compris</option>
      <option value="prix">Prix</option>
      <option value="km">Kilométrage</option>
      <option value="annee">Année</option>
      <option value="soh">SoH</option>
      <option value="date_vente">Date de vente (la plus proche)</option>
    </select></label>
    <label>Ordre<select id="ordre"><option value="auto">Par défaut</option><option value="asc">Croissant</option><option value="desc">Décroissant</option></select></label>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="nouveaux"> Nouveaux seulement</label>
    <label><input type="checkbox" id="variation"> Prix modifié seulement</label>
    <label><input type="checkbox" id="avecprix"> Avec prix seulement</label>
    <label><input type="checkbox" id="avenir"> Ventes à venir seulement</label>
    <label><input type="checkbox" id="inconnus" checked> Garder les lots dont l’info est inconnue</label>
    <button class="reset" id="reset" type="button">Réinitialiser</button>
  </div>
  <div class="outils">
    <button class="chip" id="chipfav" type="button" aria-pressed="false">★ Mes favoris</button>
    <button type="button" id="exportfav">⬇ Exporter mes favoris</button>
    <button type="button" id="importfav">⬆ Importer des favoris</button>
    <input type="file" id="fichierfav" accept="application/json,.json" hidden>
  </div>
</div>

<div class="bar" id="bar"></div>
<div id="liste"></div>
<footer class="meta" id="pied" style="margin-top:24px"></footer>
</div>

<script>
const $ = s => document.querySelector(s);
const CLE = 've.filtres3';
const lire = () => { try { return JSON.parse(localStorage.getItem(CLE)) || {} } catch { return {} } };
const ecrire = v => { try { localStorage.setItem(CLE, JSON.stringify(v)) } catch {} };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nb = n => (n === null || n === undefined || isNaN(n)) ? '?' : Math.round(n).toLocaleString('fr-FR');
const jour = s => s ? new Date(s + 'T12:00:00').toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'short'}) : null;
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const isoJour = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const ilYa = n => { const d = new Date(); d.setDate(d.getDate() - n); return isoJour(d); };

const CHAMPS = ['q','site','cmin','cmax','kmax','amin','sohmin','kwhmin','dept','vdu','vau','tri','ordre'];
const CASES = ['nouveaux','variation','avecprix','avenir','inconnus'];
let ALL = [];                      // catalogue complet (les exclusions ne masquent pas un favori)
let FAVS = lirefavs();             // {id: résumé} gardé dans le navigateur
function lirefavs(){ try { return JSON.parse(localStorage.getItem('ve.favoris')) || {} } catch { return {} } }
function ecrirefavs(){ try { localStorage.setItem('ve.favoris', JSON.stringify(FAVS)) } catch {} }
const resume = l => ({id:l.id, titre:l.titre, url:l.url, site:l.site, date_vente:l.date_vente ?? null, heure_vente:l.heure_vente ?? null,
  prix:l.prix ?? null, mise_a_prix:l.mise_a_prix ?? null, prix_max_conseille:l.prix_max_conseille ?? null});
const joursAvant = s => s ? Math.round((new Date(s + 'T12:00:00') - new Date(ilYa(0) + 'T12:00:00')) / 864e5) : null;
let DATA = null;

function depuis(iso){
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 2) return "à l'instant";
  if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60);
  return h < 24 ? `il y a ${h} h` : `il y a ${Math.round(h / 24)} j`;
}

const etat = () => {
  const e = {};
  for (const k of CHAMPS) e[k] = $('#' + k).value;
  for (const k of CASES) e[k] = $('#' + k).checked;
  return e;
};
const num = v => { const x = parseFloat(v); return isNaN(x) ? null : x; };

function garde(l, f){
  const inc = f.inconnus;
  // borne sur une valeur éventuellement inconnue : inconnu => gardé seulement si « garder les inconnus »
  const borne = (val, min, max) => {
    if (min === null && max === null) return true;
    if (val === null || val === undefined) return inc;
    return (min === null || val >= min) && (max === null || val <= max);
  };
  if (f.site && l.site !== f.site) return false;
  if (f.q) {
    const hay = norm([l.titre, l.ville, l.dept, l.site, l.texte].join(' '));
    if (!norm(f.q).split(/\s+/).every(w => hay.includes(w))) return false;
  }
  if (!borne(l.cout_estime, num(f.cmin), num(f.cmax))) return false;
  if (!borne(l.km, null, num(f.kmax))) return false;
  if (!borne(l.annee, num(f.amin), null)) return false;
  if (!borne(l.soh, num(f.sohmin), null)) return false;
  if (!borne(l.kwh, num(f.kwhmin), null)) return false;
  const depts = f.dept.split(/[\s,;]+/).filter(Boolean);
  if (depts.length && !(l.dept ? depts.includes(l.dept) : inc)) return false;
  if (f.vdu || f.vau || f.avenir) {
    if (!l.date_vente) { if (!inc) return false; }
    else if ((f.vdu && l.date_vente < f.vdu) || (f.vau && l.date_vente > f.vau) || (f.avenir && l.date_vente < ilYa(0))) return false;
  }
  if (f.avecprix && !l.prix) return false;
  if (f.nouveaux && !estNouveau(l)) return false;
  if (f.variation && !variation(l)) return false;
  return true;
}

const estNouveau = l => !!l.premiere_vue && l.premiere_vue >= ilYa(2);
function variation(l){
  if (!l.prix_precedent || !l.prix_change_le || l.prix_change_le < ilYa(7)) return null;
  return {delta: l.prix - l.prix_precedent, avant: l.prix_precedent};
}

function carte(l){
  const img = l.image ? `<img class="thumb" src="${esc(l.image)}" loading="lazy" alt="">` : '<div class="thumb">⚡</div>';
  const lieu = [l.ville, l.dept].filter(Boolean).join(' · ');
  const cout = l.cout_estime
    ? `<div class="cout"><b>≈ ${nb(l.cout_estime)} €</b> frais compris
        <small>(${nb(l.prix)} € + ${nb(l.frais_estimes)} € de frais · ${esc(l.frais_detail)}
        · barème ${l.frais_source === 'lot' ? 'du lot' : 'du site'})</small></div>`
    : `<div class="cout"><b>Prix ?</b> <small>${l.mise_a_prix ? 'mise à prix ' + nb(l.mise_a_prix) + ' €' : 'non communiqué'}
        · frais : ${esc(l.frais_detail)}</small></div>`;
  const f = [
    `<span>${esc(l.annee ?? '?')}</span>`,
    `<span><b>${nb(l.km)}</b> km</span>`,
    l.prix_type ? `<span><small>${esc(l.prix_type)}</small></span>` : '',
    l.kwh ? `<span>${esc(l.kwh)} kWh</span>` : '',
    l.soh ? `<span>SoH <b>${esc(l.soh)} %</b></span>` : '',
    lieu ? `<span>${esc(lieu)}</span>` : '',
    l.date_vente ? `<span>vente <b>${jour(l.date_vente)}</b>${l.heure_vente ? ' à ' + esc(l.heure_vente) : ''}</span>` : '<span><small>date de vente ?</small></span>',
  ].join('');
  const t = [];
  if (estNouveau(l)) t.push('<span class="tag new">NOUVEAU</span>');
  const v = variation(l);
  if (v) t.push(`<span class="tag ${v.delta < 0 ? 'down' : 'up'}">${v.delta < 0 ? '↓' : '↑'} ${nb(Math.abs(v.delta))} € (avant ${nb(v.avant)} €)</span>`);
  const j = joursAvant(l.date_vente);
  if (j === 0) t.push('<span class="tag hot">vente AUJOURD’HUI</span>');
  else if (j === 1) t.push('<span class="tag hot">vente DEMAIN</span>');
  else if (j > 1 && j <= 7) t.push(`<span class="tag warn">vente dans ${j} jours</span>`);
  else if (j < 0) t.push('<span class="tag">vente passée</span>');
  if (l.score !== undefined) t.push(`<span class="tag score" title="Note 0-100 : coût, km, année, SoH, batterie">score ${l.score}</span>`);
  if (l.prix_max_conseille) t.push(`<span class="tag">prix max conseillé ${nb(l.prix_max_conseille)} €</span>`);
  t.push(`<span class="tag">${esc(l.site)}</span>`);
  if (l.perime) t.push('<span class="tag warn">données de la veille</span>');
  const fav = !!FAVS[l.id];
  return `<a class="card" href="${esc(l.url)}" target="_blank" rel="noopener">
    <button class="fav${fav ? ' on' : ''}" type="button" data-id="${esc(l.id)}" aria-pressed="${fav}" title="${fav ? 'Retirer des favoris' : 'Mettre en favori'}">${fav ? '★' : '☆'}</button>${img}
    <div class="body"><div class="name">${esc(l.titre || '?')}</div>${cout}
    <div class="facts">${f}</div><div>${t.join('')}</div></div></a>`;
}

function carteRetiree(r){
  const j = joursAvant(r.date_vente);
  return `<a class="card retire" href="${esc(r.url)}" target="_blank" rel="noopener">
    <button class="fav on" type="button" data-id="${esc(r.id)}" aria-pressed="true" title="Retirer des favoris">★</button>
    <div class="thumb">⚡</div><div class="body"><div class="name">${esc(r.titre || r.id)}</div>
    <div class="facts"><span>${r.date_vente ? 'vente ' + jour(r.date_vente) : 'date de vente ?'}</span></div>
    <div><span class="tag warn">${j !== null && j < 0 ? 'vente passée' : 'plus dans le catalogue'}</span><span class="tag">${esc(r.site || '')}</span></div></div></a>`;
}

function trier(lots, f){
  const k = f.tri;
  const val = l => k === 'nouveaute' ? (l.premiere_vue || '') : l[k];
  // sens par défaut : nouveautés/année/SoH/date décroissants, le reste croissant
  const defDesc = ['nouveaute', 'annee', 'soh', 'score'].includes(k);
  const desc = f.ordre === 'desc' || (f.ordre === 'auto' && defDesc);
  return lots.sort((a, b) => {
    const x = val(a), y = val(b);
    const nx = x === null || x === undefined || x === '', ny = y === null || y === undefined || y === '';
    if (nx && ny) return 0;
    if (nx) return 1;            // les valeurs inconnues restent en bas
    if (ny) return -1;
    return (x > y ? 1 : x < y ? -1 : 0) * (desc ? -1 : 1);
  });
}

function rendre(){
  if (!DATA) return;
  const f = etat();
  ecrire(f);
  const solo = $('#chipfav').classList.contains('on');
  // mode favoris : tous les favoris, filtres ignorés (un lot qui dépasse ton budget reste visible)
  const lots = solo ? trier(ALL.filter(l => FAVS[l.id]), f) : trier(DATA.lots.filter(l => garde(l, f)), f);
  const retires = solo ? Object.values(FAVS).filter(r => !ALL.some(l => l.id === r.id)) : [];
  $('#liste').innerHTML = lots.slice(0, 400).map(carte).join('') + retires.map(carteRetiree).join('')
    || `<div class="empty">${solo ? 'Aucun favori : clique sur ☆ sur une carte.' : 'Aucun lot ne correspond à ces filtres.'}</div>`;
  $('#chipfav').textContent = `★ Mes favoris (${Object.keys(FAVS).length})`;
  const nouveaux = DATA.lots.filter(estNouveau).length;
  const modifs = DATA.lots.filter(variation).length;
  const nfav = Object.keys(FAVS).length;
  $('#bar').innerHTML = `<strong>${lots.length + retires.length}</strong> affiché(s) sur ${solo ? Object.keys(FAVS).length : DATA.lots.length}`
    + (nfav ? ` · ★ ${nfav} favori(s)` : '')
    + (nouveaux ? ` · ${nouveaux} nouveau(x)` : '') + (modifs ? ` · ${modifs} prix modifié(s)` : '');
}

function exclusion(data) {
  if(!data) return
  return {...data, lots : data.lots.filter((d) => !(d.texte || '').toLowerCase().includes("c-zero") && !d.texte.toLowerCase().includes("2008") && !d.texte.toLowerCase().includes("smart") && !d.texte.toLowerCase().includes("dacia") && !d.texte.toLowerCase().includes("fiat" ) && !d.texte.toLowerCase().includes("zoe") && !d.texte.toLowerCase().includes("corsa") && !d.texte.toLowerCase().includes("mokka"))}
}

async function charger(){
  try {
    const r = await fetch('lots.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
    ALL = DATA.lots;
    DATA = exclusion(DATA);
    for (const l of ALL) if (FAVS[l.id]) FAVS[l.id] = resume(l);   // garde le résumé à jour
    ecrirefavs();
  } catch (e) {
    $('#maj').textContent = 'lots.json introuvable';
    $('#liste').innerHTML = '<div class="empty">Aucune donnée pour l’instant.</div>';
    return;
  }
  $('#maj').textContent = 'mis à jour ' + depuis(DATA.genere_le);
  $('#site').innerHTML = '<option value="">Tous</option>'
    + Object.entries(DATA.sites || {}).map(([s, n]) => `<option value="${esc(s)}">${esc(s)} (${n})</option>`).join('');
  const sauve = lire();
  for (const k of CHAMPS) if (sauve[k] !== undefined) $('#' + k).value = sauve[k];
  for (const k of CASES) if (sauve[k] !== undefined) $('#' + k).checked = sauve[k];
  [...CHAMPS.map(k => '#' + k), ...CASES.map(k => '#' + k)].forEach(s => {
    $(s).addEventListener('input', rendre); $(s).addEventListener('change', rendre);
  });
  $('#liste').addEventListener('click', e => {
    const b = e.target.closest('.fav'); if (!b) return;
    e.preventDefault(); e.stopPropagation();
    const id = b.dataset.id, l = ALL.find(x => x.id === id);
    if (FAVS[id]) delete FAVS[id]; else FAVS[id] = l ? resume(l) : {id};
    ecrirefavs(); rendre();
  });
  $('#chipfav').onclick = () => { const c = $('#chipfav'); const on = !c.classList.contains('on'); c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); rendre(); };
  $('#exportfav').onclick = () => {
    const favoris = Object.values(FAVS).map(r => { const l = ALL.find(x => x.id === r.id); return l ? resume(l) : r; });
    const blob = new Blob([JSON.stringify({version:1, exporte_le:new Date().toISOString(), favoris}, null, 1)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'favoris.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('#importfav').onclick = () => $('#fichierfav').click();
  $('#fichierfav').onchange = async e => {
    const fichier = e.target.files[0]; e.target.value = ''; if (!fichier) return;
    try {
      const j = JSON.parse(await fichier.text());
      const items = (Array.isArray(j) ? j : j.favoris || []).map(x => typeof x === 'string' ? {id:x} : x).filter(x => x && x.id);
      if (!items.length) throw new Error('vide');
      let ajoutes = 0;
      for (const x of items) { if (!FAVS[x.id]) ajoutes++; const l = ALL.find(y => y.id === x.id); FAVS[x.id] = l ? resume(l) : {...FAVS[x.id], ...x}; }
      ecrirefavs(); rendre();
      alert(`${ajoutes} favori(s) ajouté(s), ${items.length - ajoutes} déjà présent(s).`);
    } catch { alert('Fichier de favoris illisible.'); }
  };
  $('#reset').onclick = () => {
    for (const k of CHAMPS) $('#' + k).value = k === 'tri' ? 'nouveaute' : k === 'ordre' ? 'auto' : '';
    for (const k of CASES) $('#' + k).checked = k === 'inconnus';
    rendre();
  };
  $('#pied').textContent = 'Frais estimés = barème du site (CGV) ou lu dans les conditions du lot, hors carte grise et transport. '
    + 'Le prix est une estimation haute ou l’enchère courante : le prix final peut différer. Vérifie toujours la fiche.';
  rendre();
}
// --- Nouvelle recherche : disponible seulement quand la page est servie par serve.py (python3 serve.py) ---
// Sur le site public, le bouton parle au serveur qui tourne sur ton PC (python3 serve.py, démarré avec WSL).
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const API = LOCAL ? '' : 'http://localhost:8000/';
async function api(chemin, opts){
  try { return await fetch(API + chemin, {cache:'no-store', ...opts}); } catch { return null; }
}
const duree = ms => { const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60; return m ? `${m} min ${s} s` : `${s} s`; };

async function suivre(debut){
  const etat = $('#etat'); etat.hidden = false; etat.className = '';
  const t0 = debut || Date.now();
  for (;;) {
    const r = await api('api/status');
    if (!r || !r.ok) { etat.className = 'err'; etat.textContent = 'Le serveur local ne répond plus.'; $('#refresh').disabled = false; return; }
    const s = await r.json();
    const dernier = (s.log || []).slice(-1)[0] || '';
    if (s.en_cours) {
      etat.textContent = `Recherche en cours depuis ${duree(Date.now() - t0)}… ${dernier}`;
    } else if (s.code === 0 || s.code === null) {
      etat.textContent = 'Recherche terminée, mise à jour de la page…';
      setTimeout(() => location.reload(), 1200); return;
    } else {
      etat.className = 'err';
      etat.textContent = `La recherche a échoué (code ${s.code}). ${dernier}`;
      $('#refresh').disabled = false; return;
    }
    await new Promise(ok => setTimeout(ok, 3000));
  }
}

async function initRecherche(){
  const btn = $('#refresh'); btn.hidden = false;           // toujours visible
  const message = (txt, err) => { const e = $('#etat'); e.hidden = false; e.className = err ? 'err' : ''; e.textContent = txt; };
  btn.onclick = async () => {
    btn.disabled = true;
    const p = await api('api/refresh', {method:'POST', headers:{'X-Veille':'1'}});
    if (p && (p.ok || p.status === 409)) return suivre();
    btn.disabled = false;
    message(p ? 'Le serveur a refusé la demande.'
              : 'Le serveur local ne répond pas. Il tourne sur le PC où est installé le scraper : lance « python3 serve.py » '
                + '(il démarre normalement tout seul avec WSL), ou ouvre la page depuis ce PC.', true);
  };
  const r = await api('api/status');
  if (r && r.ok && (await r.json()).en_cours) { btn.disabled = true; suivre(); }
}
charger();
initRecherche();
</script>
</body>
